                - heading "✕ Don't" [level=4] [ref=f5e783]
                - list [ref=f5e784]:
                  - listitem [ref=f5e785]: No blue. One accent per page; no rainbow gradients.
                  - listitem [ref=f5e786]: No emoji, no exclamation-y marketing voice.
                  - listitem [ref=f5e787]: No rounded-corner "card with left accent bar" web tropes — the callout is a pinned note, the plate a grille empruntée.
