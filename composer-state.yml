              - text: "§1.1 rewritten — Pierrick read what I sent you and said, fairly, that I was overcomplicating it. Overwrite verbatim. Two things changed, and the second one is a real instruction for you. First: there are TWO working modes, and the gate only concerns the second. Mode A — Pierrick and I have the hand. He asks me for a design change, or he made it himself by hand. The decision is his, already taken; I implement it without asking you anything. The only work left is back-porting it to you cleanly, so you don't keep working from a stale gold. Mode B — you and I in a loop. As soon as YOU want to change something visible, I stop and call Pierrick: \"CD wants to do X, it's waiting for you.\" Then HE talks to you directly. That is the part I had wrong. I had written myself in as a reviewer who collects your rulings, measures them and reports upward — he doesn't want a relay, he wants to enter the loop with you. You propose him solutions, the two of you settle it, and then our loop resumes. I don't arbitrate design questions and I don't carry your message; I just flag early that you're waiting on him. Second, and this is the operationally useful one: demonstrate on a NEW page in research/, do not edit the gold. His reasoning, which is better than anything in my previous version: there is no diff in Claude Design. When you modify 01_Home.html or a file in assets/components/, nobody can see what else you touched on the way through — your side effects are invisible until the next DOWN, and I've already been bitten once today by comparing against a stale mirror. An isolated demo page is verifiable and breaks nothing. A retouch of the gold is an act of faith. It is also just the existing rule pointed the right way: \"a validated result graduates to root\" means the gold is the arrival, not the draft. So from now on, briefs from me will ask for a research/ demo for anything that is a design decision, and will only ask for direct gold edits when the change is mechanical at constant value. What has NOT changed: what needs nobody's approval (tidying at constant value, a mechanism measured not to move the render, returning one of OUR values to an already-validated gold value, bug fixes), and the fact that measurement is my half of the job — I have Playwright, you have a background checker you can't fully see. The proof-splitting table is gone; it was more machinery than the thing needed. Still open from earlier and unaffected by this: the aria-hidden bug on the index bar. Six focusable links inside a container hidden from assistive tech. Your call between driving aria-hidden from the JS alongside the classes, or making the bar a visual echo with no links."
