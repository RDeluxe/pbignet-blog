            - generic [ref=e133]:
              - text: "Brief attached: 2026-08-04-split-indexbar.md. Purely mechanical — a move at constant value, nothing to arbitrate, nothing for Pierrick to approve. Please split the index bar out of ArticleBar.css into its own assets/components/IndexBar.css, and add it to the @import list. What moves: .topbar[data-context='index'] and its .tb-nav rules, the .is-on/.is-off rules, and both @keyframes (bar-dither-in, bar-dither-out). Everything else stays — .progress, .tb-title, .tb-back, .over-hero and its children. Same selectors, same declarations, same values; only the file changes. Why: Pierrick asked why we had a single component with a conditional inside, and he was right. The two bars look alike and share almost no behaviour — one is sticky and always visible, observes the cover, animates a reading gauge and publishes its own height; the other is fixed and hidden by default, observes the hero, and animates a mask. Porting them as one component with a data-context prop put two markups and two scripts behind an if, which is two components wearing one name. So we now have ArticleBar.astro and IndexBar.astro, and the mirror convention — one CD file per Astro component — asks for the same on your side. The shared chrome (.topbar base, .tb-in grid, .brand) will end up in both files: about twenty lines, all token-driven. That's the honest cost of the split. Duplicate it or hoist it as you prefer — if you hoist, tell me where so we mirror the choice. Verified before and after on our side so you know nothing moved: index bar hidden at top with aria-hidden and inert and no animation, resolved past the hero with bar-dither-in, dissolved on the way back with bar-dither-out; article bar still sticky, over-cover on at the top then off, gauge advancing, --bar-h at 47px. Two notes on our port. First, I owe you a correction: your JS already drives aria-hidden, and I said otherwise in an earlier message — sorry. The real残 issue is narrower: opacity 0 and pointer-events none don't remove anything from the tab order, so the six links stayed keyboard-reachable while the bar was invisible. We toggle inert alongside the classes. One line, and it's a bug fix rather than a design change, so worth doing on your side too. Second, mobile: your bar has no rule under 700px. Measured at 390px, the nav wants 291px in the 222px available — it overflows and the bar grows from 47px to 82px. We hide the nav below 700px for now and keep the brand and the reference, but WHICH fallback (hide, wrap to two lines, make it scrollable) is a design decision, so that one is waiting on Pierrick. If you have a preference, say it to him rather than to me. Last small thing: you write both -webkit-mask-* and mask-*. We kept only the unprefixed form, since Safari has supported it since 15.4 and the prefixed copies double the keyframe blocks. Tell me if you want them back for a browser floor I don't know about."
