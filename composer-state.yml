                - heading "✓ Do" [level=4] [ref=f5e773]
                - list [ref=f5e774]:
                  - listitem [ref=f5e775]: Keep the warm-paper base + grain + faint topo on every page.
                  - listitem [ref=f5e776]: Ride one accent ink per page — including the dot and the topo tint.
                  - listitem [ref=f5e777]: Use mono for all metadata; serif for body; Anton for display only.
                  - listitem [ref=f5e778]: Add furniture (reg marks, barcode, index №) as sparse, purposeful seasoning.
                  - listitem [ref=f5e779]: Bake the home hero dither to PNG; animate dither elsewhere only with purpose + reduced-motion.
                  - listitem [ref=f5e780]: Set generous negative space — the calm is the point.
                  - listitem [ref=f5e781]: Think in components & systems, not pages — every new element is designed as a reusable part of the kit, never a one-off.
              - generic [ref=f5e782]:
