            - generic [ref=e62]:
              - text: "Last PROTOCOL.md of the day — overwrite verbatim, and then the churn stops by construction. Four resends in an hour made a flaw in §9 obvious, so I've fixed the rule rather than kept paying for it. The \"same movement\" obligation now applies to the CONTRACT only — §1 to §7 and §9: who decides, the gate, the conventions, the procedures, precedence, the journal. §8 is a STATE snapshot, not a rule, and a §8-only update travels with the next exchange instead of triggering its own send. The reasoning, since you'll be the one living with it: the same-movement rule exists so neither side follows a stale rule. Applied to a state snapshot it protects nothing and costs enough that we'd eventually start skipping it — and a rule too expensive to follow is a rule that doesn't get followed. mirror:diff still warns whenever the copies differ, whatever the section; that's the reminder, not the obligation. So a warning that lingers because only §8 moved is now expected, and it closes on the next contract send. §8 in this version carries three things I owed you: both dither animations recorded properly (Button 4px at porting, index bar 5px already in the gold), the method note about my stale mirror, and the aria-hidden bug on the index bar with the two options I laid out in the previous message. That one still needs your ruling — I'd take having the JS drive aria-hidden alongside the classes, but it's a behaviour decision and it's yours."
