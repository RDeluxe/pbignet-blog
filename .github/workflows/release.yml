name: Release

on:
  push:
    branches: [main]

env:
  IMAGE_NAME: ghcr.io/rdeluxe/pbignet-blog
  DOCKHAND_WEBHOOK_URL: ${{ secrets.DOCKHAND_WEBHOOK_URL }}
  DOCKHAND_WEBHOOK_SECRET: ${{ secrets.DOCKHAND_WEBHOOK_SECRET }}

jobs:
  release:
    runs-on: [self-hosted, crewbox]
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Compute short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Le build Astro se fait dans le Dockerfile (pnpm build, cible prod)
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:sha-${{ steps.sha.outputs.short }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Skip Dockhand webhook (missing secrets)
        if: env.DOCKHAND_WEBHOOK_URL == '' || env.DOCKHAND_WEBHOOK_SECRET == ''
        run: echo "Skipping Dockhand webhook because DOCKHAND_WEBHOOK_URL or DOCKHAND_WEBHOOK_SECRET is not set."

      - name: Ping Dockhand webhook
        if: env.DOCKHAND_WEBHOOK_URL != '' && env.DOCKHAND_WEBHOOK_SECRET != ''
        run: |
          CURL_EXIT=0
          HTTP_CODE=$(curl -sS -o /tmp/dockhand.out -w "%{http_code}" -X POST "$DOCKHAND_WEBHOOK_URL" \
            --connect-timeout 10 \
            --max-time 45 \
            --retry 2 \
            --retry-delay 2 \
            --retry-all-errors \
            -H "X-Gitlab-Token: $DOCKHAND_WEBHOOK_SECRET" \
            -H "Content-Type: application/json" \
            --data '{}') || CURL_EXIT=$?
          echo "Dockhand HTTP status: $HTTP_CODE"
          cat /tmp/dockhand.out || true
          echo
          if [ "$CURL_EXIT" -ne 0 ]; then
            echo "Webhook call failed before a valid HTTP response (curl exit $CURL_EXIT)"
            exit "$CURL_EXIT"
          fi
          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "Webhook call failed (HTTP $HTTP_CODE)"
            exit 1
          fi
