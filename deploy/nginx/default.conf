# Nginx du blog de production (Astro statique), indexable. Repris de homescripts (blog-astro).
# Il tourne en uid 101 sans capabilities, d’où le port 8080.

# Anciennes URL Ghost -> nouvelles (301). La map est redirects/redirects.map, générée par `pnpm redirects`.
# The image paths are longer than the default 64-byte bucket.
map_hash_bucket_size 128;
map $uri $redirect_target {
    default "";
    include /etc/nginx/redirects.map;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    # Directory redirects would otherwise point at :8080 behind Traefik.
    absolute_redirect off;

    if ($redirect_target != "") {
        return 301 $redirect_target;
    }

    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Ghost's admin is gone.
    location /ghost/ {
        return 404;
    }

    location = /404.html {
        internal;
    }
}
