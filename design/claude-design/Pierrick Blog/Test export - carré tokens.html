<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>exhale — Répartition des tokens · carré LinkedIn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700;800;900&family=Space+Mono:wght@400;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  :root {
    --paper: #f6f5f1;
    --card:  #f1ece2;
    --ink: #18170f;
    --ink-2: #4a4636;
    --ink-3: #8b8672;
    --accent: #1f4a37;
    --line: rgba(24,23,15,0.22);
    --line-soft: rgba(24,23,15,0.12);
    --display: 'Anton', sans-serif;
    --sans: 'Archivo', system-ui, sans-serif;
    --mono: 'Space Mono', ui-monospace, monospace;
    --serif: 'Newsreader', Georgia, serif;
    /* token-type segment colours */
    --t-cr:  #1f4a37;
    --t-cw:  #3a5a78;
    --t-in:  #b0822f;
    --t-out: #a8503a;
  }

  .stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #cfc7b8; overflow: hidden; }
  .square {
    width: 1080px; height: 1080px; flex: none;
    transform-origin: center center; position: relative;
    background: var(--paper); color: var(--ink);
    -webkit-font-smoothing: antialiased; overflow: hidden;
  }
  .square .topo { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
  .square .grain { position: absolute; inset: 0; z-index: 1; pointer-events: none; background-image: var(--grain); background-repeat: repeat; mix-blend-mode: multiply; opacity: 0.85; }
  .square .vig { position: absolute; inset: 0; z-index: 1; pointer-events: none; background: radial-gradient(120% 100% at 50% 0%, transparent 58%, rgba(40,36,28,0.07) 100%); }

  .regmark { position: absolute; width: 22px; height: 22px; z-index: 4; opacity: 0.6; }
  .regmark::before, .regmark::after { content: ""; position: absolute; background: var(--ink); }
  .regmark::before { left: 50%; top: 0; width: 1px; height: 100%; transform: translateX(-50%); }
  .regmark::after { top: 50%; left: 0; height: 1px; width: 100%; transform: translateY(-50%); }
  .regmark.tl { top: 26px; left: 26px; } .regmark.tr { top: 26px; right: 26px; }
  .regmark.bl { bottom: 26px; left: 26px; } .regmark.br { bottom: 26px; right: 26px; }

  .frame { position: absolute; inset: 70px; z-index: 3; }
  .card {
    position: relative; width: 100%; height: 100%;
    background: var(--card); border: 1px solid var(--line);
    padding: 54px 56px 46px;
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .corner { position: absolute; width: 14px; height: 14px; border: 1.6px solid var(--ink-2); }
  .corner.tl { top: -1px; left: -1px; border-right: none; border-bottom: none; }
  .corner.tr { top: -1px; right: -1px; border-left: none; border-bottom: none; }
  .corner.bl { bottom: -1px; left: -1px; border-right: none; border-top: none; }
  .corner.br { bottom: -1px; right: -1px; border-left: none; border-top: none; }

  .chead { display: flex; justify-content: space-between; align-items: flex-start; gap: 24px; }
  .chead .title { font-family: var(--display); font-size: 54px; line-height: 0.9; text-transform: uppercase; letter-spacing: 0.005em; white-space: nowrap; }
  .chead .meta { font-family: var(--mono); font-size: 12px; letter-spacing: 0.1em; color: var(--ink-2); text-align: right; line-height: 1.7; white-space: nowrap; padding-top: 6px; }
  .chead .meta b { color: var(--accent); font-weight: 700; }
  .csub { display: block; font-family: var(--serif); font-size: 28px; font-weight: 500; color: var(--ink); margin-top: 18px; line-height: 1.32; max-width: 40ch; }

  .chart { width: 100%; }
  .chart svg { width: 100%; height: auto; display: block; }
  .ax-line { stroke: var(--line-soft); stroke-width: 1; }
  .ax-base { stroke: var(--line); stroke-width: 1.5; }
  .ax-tick { font-family: var(--mono); font-size: 13px; fill: var(--ink-3); letter-spacing: 0.02em; }
  .col-total { font-family: var(--mono); font-size: 16px; font-weight: 700; fill: var(--ink); }
  .col-name { font-family: var(--sans); font-weight: 700; font-size: 16px; fill: var(--ink); letter-spacing: -0.01em; }

  .legend { display: flex; gap: 26px; flex-wrap: wrap; align-items: center; }
  .legend .lg { display: inline-flex; align-items: center; gap: 9px; font-family: var(--mono); font-size: 13px; letter-spacing: 0.04em; color: var(--ink-2); }
  .legend .sw { width: 14px; height: 14px; flex: none; }
  .cfoot { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; }
  .cfoot .mark { font-family: var(--mono); font-size: 11.5px; color: var(--ink-3); white-space: nowrap; text-transform: uppercase; letter-spacing: 0.14em; }
  .cfoot .mark .dot { color: var(--accent); }
</style>
</head>
<body>
<div class="stage">
  <div class="square" id="square">
    <canvas class="topo" id="topo"></canvas>
    <div class="grain"></div>
    <div class="vig"></div>
    <div class="regmark tl"></div><div class="regmark tr"></div>
    <div class="regmark bl"></div><div class="regmark br"></div>

    <div class="frame">
      <div class="card">
        <span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>

        <div class="chead">
          <div class="title">OÙ PARTENT<br>
NOS PETITS TOKENS ?</div>
          <div class="meta">5 MODÈLES · 1 TÂCHE<br>TOKENS PAR TYPE<br><b>colonne = total</b></div>
        </div>
        <p class="csub">La différence de prix vient majoritairement de l'output.</p>

        <div class="chart" id="chart"></div>

        <div class="legend" id="legend"></div>

        <div class="cfoot">
          <div></div>
          <div class="mark">dot<span class="dot">·</span>paper</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="assets/texture.js"></script>
<script>
  Grain.apply(16);
  Topo.draw(document.getElementById('topo'), { width: 1080, height: 1080, color: 'rgba(31,74,55,0.05)', levels: 16, cell: 24, scale: 0.0021, seed: 14, emphasizeEvery: 5 });

  // ----- token types (stack order: bottom → top) -----
  const TYPES = [
    { key:'cr',  label:'Cache read',  color:'var(--t-cr)'  },
    { key:'cw',  label:'Cache write', color:'var(--t-cw)'  },
    { key:'in',  label:'Input',       color:'var(--t-in)'  },
    { key:'out', label:'Output',      color:'var(--t-out)' },
  ];
  // ----- data, ordered by total descending -----
  const D = [
    { name:'Sonnet',   cr:782535, cw:87222, in:18,    out:52531 },
    { name:'Opus',     cr:497780, cw:66615, in:20,    out:9972  },
    { name:'Composer', cr:443200, cw:0,     in:94479, out:17024 },
    { name:'Fable',    cr:334157, cw:63923, in:14,    out:7078  },
    { name:'Codex',    cr:236032, cw:0,     in:36604, out:4756  },
  ];
  D.forEach(d => d.total = TYPES.reduce((s,t)=>s + d[t.key], 0));

  // ----- stacked vertical bars -----
  (function(){
    const W=1000, H=560, mL=86, mR=18, mT=44, mB=52;
    const x0=mL, x1=W-mR, y0=mT, y1=H-mB;
    const yMax=1000000, sY=(y1-y0)/yMax;
    const py = v => y1 - v*sY;
    let g='';
    // gridlines + y ticks
    [0,250000,500000,750000,1000000].forEach(t=>{
      const y=py(t);
      g += `<line class="${t===0?'ax-base':'ax-line'}" x1="${x0}" y1="${y.toFixed(1)}" x2="${x1}" y2="${y.toFixed(1)}"/>`;
      const lab = t===0 ? '0' : t===1000000 ? '1 M' : (t/1000)+' k';
      g += `<text class="ax-tick" x="${x0-12}" y="${(y+5).toFixed(1)}" text-anchor="end">${lab}</text>`;
    });
    // columns
    const band=(x1-x0)/D.length, colW=104;
    D.forEach((d,i)=>{
      const cx = x0 + band*i + (band-colW)/2;
      let cy = y1;
      TYPES.forEach(t=>{
        const h = d[t.key]*sY;
        if (h>0.2) g += `<rect x="${cx.toFixed(1)}" y="${(cy-h).toFixed(1)}" width="${colW}" height="${h.toFixed(1)}" fill="${t.color}"/>`;
        cy -= h;
      });
      const cMid = cx + colW/2;
      g += `<text class="col-total" x="${cMid.toFixed(1)}" y="${(py(d.total)-12).toFixed(1)}" text-anchor="middle">${Math.round(d.total/1000)} k</text>`;
      g += `<text class="col-name" x="${cMid.toFixed(1)}" y="${(y1+30).toFixed(1)}" text-anchor="middle">${d.name}</text>`;
    });
    document.getElementById('chart').innerHTML =
      `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Répartition des tokens par type, colonnes empilées">${g}</svg>`;
  })();

  // ----- legend -----
  document.getElementById('legend').innerHTML = TYPES.map(t=>
    `<span class="lg"><span class="sw" style="background:${t.color}"></span>${t.label}</span>`
  ).join('');

  // ----- fit -----
  function fit(){
    const s = document.getElementById('square');
    const pad = 24;
    const k = Math.min((window.innerWidth - pad*2)/1080, (window.innerHeight - pad*2)/1080);
    s.style.transform = `scale(${k})`;
  }
  window.addEventListener('resize', fit); fit();
</script>
</body>
</html>
