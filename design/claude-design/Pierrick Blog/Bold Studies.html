<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>dot·paper — Bold Studies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;600;700;800;900&family=Space+Mono:wght@400;700&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/paper.css">
<style>
  body { background: #161512; color: #e7e2d6; }
  .wall { max-width: 1280px; margin: 0 auto; padding: 56px 28px 120px; position: relative; z-index: 2; }
  .wall-head { border-bottom: 1px solid rgba(231,226,214,0.2); padding-bottom: 18px; margin-bottom: 48px; display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 14px; }
  .wall-head .t { font-family: 'Anton', sans-serif; font-size: clamp(28px,4vw,46px); text-transform: uppercase; letter-spacing: 0.01em; }
  .wall-head .t .red { color: #d8492c; }
  .wall-head .s { font-family: 'Space Mono', monospace; font-size: 12px; letter-spacing: 0.08em; color: #9b9788; max-width: 40ch; line-height: 1.5; }

  figure { margin: 0 0 64px; }
  figcaption { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; margin-bottom: 14px; flex-wrap: wrap; }
  figcaption .lab { font-family: 'Space Mono', monospace; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: #e7e2d6; }
  figcaption .lab .n { color: #6f6b5e; margin-right: 10px; }
  figcaption .cap { font-family: 'Space Mono', monospace; font-size: 11.5px; color: #9b9788; letter-spacing: 0.04em; }

  .study { position: relative; width: 100%; overflow: hidden; background: #0c0b09; box-shadow: 0 30px 70px rgba(0,0,0,0.5); }
  .study .dsrc { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .study .dither-canvas { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; display: block; }
  .study .grain-on { position: absolute; inset: 0; background-image: var(--grain); mix-blend-mode: overlay; opacity: 0.5; pointer-events: none; z-index: 6; }
  .study .topo-on { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 4; }

  /* shared composition bits */
  .cmark { position: absolute; font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.1em; z-index: 8; }
  .reg { position: absolute; width: 18px; height: 18px; z-index: 8; opacity: 0.85; }
  .reg::before,.reg::after{content:"";position:absolute;background:currentColor;}
  .reg::before{left:50%;top:0;width:1px;height:100%;transform:translateX(-50%);}
  .reg::after{top:50%;left:0;height:1px;width:100%;transform:translateY(-50%);}

  /* ============ STUDY 01 — Fuji, dither-mix sky + title on photo ============ */
  .st01 { aspect-ratio: 1500/1001; }
  .st01 .dither-canvas { -webkit-mask-image: linear-gradient(to bottom, #000 0%, #000 20%, transparent 42%); mask-image: linear-gradient(to bottom, #000 0%, #000 20%, transparent 42%); z-index: 2; }
  .st01 .topo-on { -webkit-mask-image: linear-gradient(to bottom, #000 0%, #000 18%, transparent 38%); mask-image: linear-gradient(to bottom, #000 0%, #000 18%, transparent 38%); }
  .st01 .metabar { position: absolute; top: 7%; left: 0; right: 0; z-index: 7; display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; padding: 0 6%; font-family: 'Space Mono', monospace; color: #1a1916; }
  .st01 .metabar .k { font-size: 10px; letter-spacing: 0.12em; color: #b3ad9e; }
  .st01 .metabar .v { font-size: 12px; font-weight: 700; color: #f1ebdd; }
  .st01 .title01 { position: absolute; left: 0; right: 0; top: 25%; text-align: center; z-index: 5; font-family: 'Anton', sans-serif; font-size: clamp(72px, 13.5vw, 196px); line-height: 0.8; letter-spacing: 0.03em; color: #f1ebdd; text-shadow: 0 3px 34px rgba(0,0,0,0.55); }
  .st01 .sub01 { position: absolute; left: 6%; bottom: 9%; z-index: 7; font-family: 'Space Mono', monospace; color: #e9e3d6; }
  .st01 .sub01 .big { font-family: 'Anton', sans-serif; font-size: clamp(20px,2.6vw,34px); letter-spacing: 0.04em; text-transform: uppercase; }
  .st01 .sub01 .sm { font-size: 12px; letter-spacing: 0.1em; color: #cfc9bb; margin-top: 4px; }
  .st01 .vcap01 { position: absolute; right: 5%; bottom: 9%; writing-mode: vertical-rl; font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.22em; color: #e9e3d6; z-index: 7; text-transform: uppercase; }

  /* ============ STUDY 02 — Torii, duotone red dither + bold type ============ */
  .st02 { aspect-ratio: 1500/843; }
  .st02 .dither-canvas { z-index: 2; }
  .st02 .kicker02 { position: absolute; top: 8%; left: 6%; right: 6%; z-index: 6; display: flex; justify-content: space-between; font-family: 'Space Mono', monospace; font-size: 12px; letter-spacing: 0.12em; text-transform: lowercase; color: #1c2a30; }
  .st02 .title02 { position: absolute; left: 5%; bottom: 7%; z-index: 6; font-family: 'Archivo', sans-serif; font-weight: 900; font-size: clamp(60px,13vw,184px); line-height: 0.78; letter-spacing: -0.05em; text-transform: lowercase; color: #efe8d8; text-shadow: 0.05em 0.05em 0 #d8492c; }
  .st02 .jp02 { position: absolute; right: 6%; top: 42%; writing-mode: vertical-rl; font-family: 'Noto Sans JP', sans-serif; font-weight: 900; font-size: clamp(28px,5vw,64px); color: #d8492c; z-index: 6; letter-spacing: 0.1em; }
  .st02 .credit02 { position: absolute; right: 6%; bottom: 8%; z-index: 6; font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.08em; color: #1c2a30; }

  /* ============ STUDY 03 — Street, full dither + vertical type ============ */
  .st03 { aspect-ratio: 1000/1500; max-width: 760px; margin: 0 auto; }
  .st03 .dither-canvas { z-index: 2; }
  .st03 .top03 { position: absolute; top: 4%; left: 6%; right: 6%; z-index: 6; display: flex; justify-content: space-between; font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: #ece6d6; mix-blend-mode: difference; }
  .st03 .title03 { position: absolute; left: 5%; bottom: 5%; z-index: 6; font-family: 'Anton', sans-serif; font-size: clamp(56px,15vw,150px); line-height: 0.82; letter-spacing: 0.01em; text-transform: uppercase; color: #f0ead9; }
  .st03 .title03 .o { color: transparent; -webkit-text-stroke: 2px #f0ead9; }
  .st03 .barcode03 { position: absolute; right: 6%; bottom: 7%; z-index: 6; }
  .st03 .jp03 { position: absolute; right: 7%; top: 12%; writing-mode: vertical-rl; font-family: 'Noto Sans JP', serif; font-weight: 700; font-size: clamp(30px,7vw,76px); color: #f0ead9; z-index: 6; letter-spacing: 0.14em; mix-blend-mode: difference; }

  /* ============ STUDY 04 — photo inside the type (clip) ============ */
  .st04 { aspect-ratio: 1500/820; background: #ece5d6; }
  .st04 .topo-on { z-index: 1; }
  .st04 .clipwrap { position: absolute; inset: 0; z-index: 3; display: flex; flex-direction: column; justify-content: center; padding: 0 5%; }
  .st04 .clip-type {
    position: relative;
    font-family: 'Anton', sans-serif; text-transform: uppercase;
    font-size: clamp(70px, 15vw, 232px); line-height: 0.78; letter-spacing: -0.005em;
    background-image: url('assets/photos/04-dither.png');
    background-size: 165% auto; background-position: 50% 62%;
    -webkit-background-clip: text; background-clip: text;
    color: transparent; -webkit-text-fill-color: transparent;
  }
  .st04 .clip-type::before {
    content: attr(data-text); position: absolute; left: 0; top: 0;
    color: #2b2823; -webkit-text-fill-color: #2b2823; z-index: -1;
  }
  .st04 .label04 { position: absolute; z-index: 4; font-family: 'Space Mono', monospace; color: #44403a; }
  .st04 .l-tl { top: 7%; left: 5%; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; }
  .st04 .l-tr { top: 7%; right: 5%; font-size: 12px; letter-spacing: 0.14em; text-align: right; }
  .st04 .l-bl { bottom: 8%; left: 5%; font-size: 12px; letter-spacing: 0.08em; max-width: 42ch; line-height: 1.5; }
  .st04 .inset04 { position: absolute; right: 5%; bottom: 8%; width: 26%; aspect-ratio: 4/3; z-index: 4; overflow: hidden; border: 2px solid #2a2722; }
  .st04 .inset04 .dsrc { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

  @media (max-width: 720px){
    .st01 .title01{ font-size: 26vw; }
    .st04 .clip-type{ font-size: 24vw; }
  }
</style>
</head>
<body>
<div class="wall">
  <div class="wall-head">
    <div class="t">Bold <span class="red">studies</span> — effects × pictures</div>
    <div class="s">Round 2. Dithering, topography and type baked directly into your photographs — font-on-picture, RETRO-style. Four integration moves to react to.</div>
  </div>

  <!-- STUDY 01 -->
  <figure>
    <figcaption>
      <span class="lab"><span class="n">01</span>Dither-mix · type on photo</span>
      <span class="cap">sky dissolves into 1-bit dither + contours · title sits in the negative space, multiply-blended onto the mountain</span>
    </figcaption>
    <div class="study st01">
      <img class="dsrc" src="assets/photos/01.jpg" alt="Mount Fuji at dusk">
      <canvas class="dither-canvas"></canvas>
      <canvas class="topo-on" id="topo01"></canvas>
      <div class="grain-on"></div>
      <div class="reg" style="top:14px;left:14px;color:#e9e3d6;"></div>
      <h2 class="title01">FUJI</h2>
      <div class="sub01">
        <div class="big">Kawaguchiko</div>
        <div class="sm">BLUE HOUR · DITHERED 8×8 · CONTOURS · ⓒ CLAY BANKS</div>
      </div>
      <div class="vcap01">DOT · PAPER / 003,776 M</div>
    </div>
  </figure>

  <!-- STUDY 02 -->
  <figure>
    <figcaption>
      <span class="lab"><span class="n">02</span>Duotone riso · bold word</span>
      <span class="cap">whole frame dithered into a two-ink riso (red + slate) · heavy lowercase type in the water, misregistered</span>
    </figcaption>
    <div class="study st02">
      <img class="dsrc" src="assets/photos/02.jpg" alt="Itsukushima torii gate">
      <canvas class="dither-canvas"></canvas>
      <div class="grain-on"></div>
      <div class="kicker02"><span>itsukushima · miyajima</span><span>vol. ∞ — 2026 edition</span></div>
      <div class="jp02">鳥居</div>
      <h2 class="title02">torii</h2>
      <div class="credit02">ⓒ nicki eliza<br>riso duotone</div>
    </div>
  </figure>

  <!-- STUDY 03 -->
  <figure>
    <figcaption>
      <span class="lab"><span class="n">03</span>Full dither · vertical poster</span>
      <span class="cap">portrait frame fully dithered · stacked display type, outline + solid, difference-blended labels and kanji</span>
    </figcaption>
    <div class="study st03">
      <img class="dsrc" src="assets/photos/03.jpg" alt="Tokyo backstreet with cherry blossom">
      <canvas class="dither-canvas"></canvas>
      <div class="grain-on"></div>
      <div class="top03"><span>location · tokyo</span><span>04 / 2026</span></div>
      <div class="jp03">坂道</div>
      <h2 class="title03">DOWN<br><span class="o">HILL</span></h2>
      <div class="barcode03"><div class="barcode" style="--ink:#f0ead9;"></div><div class="barcode-num" style="color:#cfc9bb;">PB · 0451 · TOKYO · ∞</div></div>
    </div>
  </figure>

  <!-- STUDY 04 -->
  <figure>
    <figcaption>
      <span class="lab"><span class="n">04</span>Photo-in-type · clip mask</span>
      <span class="cap">the dithered photograph lives inside the letterforms · type-as-window on paper, contours behind</span>
    </figcaption>
    <div class="study st04">
      <canvas class="topo-on" id="topo04"></canvas>
      <div class="grain-on"></div>
      <div class="clipwrap"><div class="clip-type" data-text="NIPPON">NIPPON</div></div>
      <div class="label04 l-tl">PHOTO-ESSAY №04</div>
      <div class="label04 l-tr">FUJI · CHURETO PAGODA<br>35.40N 138.80E</div>
      <div class="label04 l-bl">The photograph is the fill of the type — dithered, clipped, and set on bare paper. ⓒ manuel cosentino.</div>
      <div class="inset04"><img class="dsrc" src="assets/photos/04.jpg" alt="Chureito pagoda and Fuji"><canvas class="dither-canvas"></canvas></div>
    </div>
  </figure>
</div>

<script src="assets/texture.js"></script>
<script src="assets/dither.js"></script>
<script>
  Grain.apply(20);
  // STUDY 01 — B&W dither of the sky region; contours over sky
  Dither.photo(document.querySelector('.st01'), { cell: 3, ink: '20,20,24', paper: '231,226,214', contrast: 1.45, brightness: 0.0, boil: 0.05, fps: 12 });
  Topo.mount(document.getElementById('topo01'), { color: 'rgba(20,20,22,0.5)', levels: 16, cell: 18, scale: 0.0030, seed: 9, emphasizeEvery: 4 });

  // STUDY 02 — duotone riso red
  Dither.photo(document.querySelector('.st02'), { cell: 3, ink: '198,58,34', paper: '232,224,206', contrast: 1.3, brightness: 0.06, boil: 0.05, fps: 12 });

  // STUDY 03 — full B&W dither
  Dither.photo(document.querySelector('.st03'), { cell: 4, ink: '24,22,18', paper: '233,227,214', contrast: 1.28, brightness: 0.05, boil: 0.05, fps: 12 });

  // STUDY 04 — inset dither + contour bg
  Dither.photo(document.querySelector('.st04 .inset04'), { cell: 2, ink: '26,24,18', paper: '233,228,216', contrast: 1.3, brightness: 0.04, boil: 0.04, fps: 12 });
  Topo.mount(document.getElementById('topo04'), { color: 'rgba(40,38,30,0.10)', levels: 16, cell: 24, scale: 0.0022, seed: 12, emphasizeEvery: 5 });
</script>
</body>
</html>
