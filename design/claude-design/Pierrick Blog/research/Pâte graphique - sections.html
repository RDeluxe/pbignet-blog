<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>exhale — Séparer les sections</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700;800;900&family=Space+Mono:wght@400;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/paper.css">
<style>
  :root {
    --paper: #ece6da;
    --paper-2: #e3dccd;
    --ink: #18170f;
    --ink-2: #4a4636;
    --ink-3: #8b8672;
    --accent: #1f4a37;
    --accent-rgb: 31,74,55;
    --line: rgba(24,23,15,0.22);
    --line-soft: rgba(24,23,15,0.12);
    --topo: rgba(31,74,55,0.06);
  }
  .page { padding-bottom: 60px; }
  .wrap { max-width: 1080px; }
  .head { border-bottom: 2px solid var(--ink); padding: 22px 0 14px; display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; flex-wrap: wrap; }
  .head .title { font-family: 'Anton', sans-serif; font-size: clamp(30px,4.4vw,50px); line-height: 0.9; text-transform: uppercase; }
  .head .title .dot { color: var(--accent); }
  .head .meta { font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.08em; color: var(--ink-2); text-align: right; line-height: 1.6; }
  .intro { font-family: var(--serif); font-size: clamp(16px,1.7vw,20px); line-height: 1.5; color: var(--ink-2); max-width: 64ch; margin: 24px 0 8px; }
  .intro b { color: var(--ink); }

  figure { margin: 52px 0 0; }
  figcaption { display: flex; align-items: baseline; gap: 14px; border-bottom: 1px solid var(--line); padding-bottom: 12px; margin-bottom: 18px; flex-wrap: wrap; }
  figcaption .no { font-family: 'Space Mono', monospace; font-size: 12px; color: var(--ink-3); letter-spacing: 0.12em; }
  figcaption .nm { font-family: 'Anton', sans-serif; font-size: clamp(20px,2.6vw,30px); text-transform: uppercase; }
  figcaption .rec { font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 0.12em; color: #fff; background: var(--accent); padding: 3px 8px; margin-left: 6px; }
  figcaption .dz { font-family: 'Space Mono', monospace; font-size: 11.5px; color: var(--ink-2); letter-spacing: 0.04em; margin-left: auto; max-width: 44ch; line-height: 1.5; text-align: right; }

  .plate { position: relative; border: 1px solid var(--line); padding: 26px 22px; background: var(--paper); }
  .plate .corner { position: absolute; width: 12px; height: 12px; border: 1.5px solid var(--ink-2); }
  .plate .corner.tl { top: -1px; left: -1px; border-right: none; border-bottom: none; }
  .plate .corner.tr { top: -1px; right: -1px; border-left: none; border-bottom: none; }
  .plate .corner.bl { bottom: -1px; left: -1px; border-right: none; border-top: none; }
  .plate .corner.br { bottom: -1px; right: -1px; border-left: none; border-top: none; }
  .plate svg { display: block; }
  .plate .ptag { position: absolute; top: 10px; right: 12px; font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 0.14em; color: var(--ink-3); text-transform: uppercase; }
</style>
</head>
<body>
<canvas class="topo-layer" id="topo"></canvas>
<div class="grain-layer"></div>
<div class="vignette"></div>
<div class="regmark tl"></div><div class="regmark tr"></div>
<div class="regmark bl"></div><div class="regmark br"></div>

<div class="page">
  <div class="wrap">
    <div class="head">
      <div class="title">Séparer<br>les sections<span class="dot">.</span></div>
      <div class="meta">VARIANTES · 03<br>BASE : DITHERING (FIG. 02)<br>OBJECTIF : COUCHES LISIBLES</div>
    </div>
    <p class="intro">Le dithering en dégradé fond les frontières entre couches. Trois façons de rendre les <b>8 sections nettes</b> sans perdre la trame. Dis-moi laquelle on garde.</p>

    <!-- A — GAPS -->
    <figure>
      <figcaption>
        <span class="no">A</span><span class="nm">Tranches détachées</span><span class="rec">recommandé</span>
        <span class="dz">un filet de papier nu entre chaque couche — la pyramide se lit comme une pile de strates. Silhouette en pointillés conservée.</span>
      </figcaption>
      <div class="plate">
        <span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
        <span class="ptag">A · GAP</span>
        <div id="d-gap"></div>
      </div>
    </figure>

    <!-- B — KEYLINE -->
    <figure>
      <figcaption>
        <span class="no">B</span><span class="nm">Liseré papier</span>
        <span class="dz">couches jointives, séparées par un trait de réserve (papier) net. Plus compact, garde la masse de la pyramide.</span>
      </figcaption>
      <div class="plate">
        <span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
        <span class="ptag">B · KEYLINE</span>
        <div id="d-key"></div>
      </div>
    </figure>

    <!-- C — INK RULE -->
    <figure>
      <figcaption>
        <span class="no">C</span><span class="nm">Trait d'encre</span>
        <span class="dz">couches jointives séparées par une règle d'encre franche. Le plus « imprimé / technique », contraste fort.</span>
      </figcaption>
      <div class="plate">
        <span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
        <span class="ptag">C · INK</span>
        <div id="d-ink"></div>
      </div>
    </figure>
  </div>
</div>

<script src="../assets/texture.js"></script>
<script src="../assets/diagram.js"></script>
<script>
  Grain.apply(18);
  Topo.mount(document.getElementById('topo'), { color: 'rgba(31,74,55,0.05)', levels: 15, cell: 26, scale: 0.0020, seed: 14, emphasizeEvery: 5 });
  Diagram.pyramid(document.getElementById('d-gap'), { style: 'dither', gap: 6 });
  Diagram.pyramid(document.getElementById('d-key'), { style: 'dither', divider: 'keyline' });
  Diagram.pyramid(document.getElementById('d-ink'), { style: 'dither', divider: 'ink' });
</script>
</body>
</html>
